<div class="min-h-screen flex items-center justify-center bg-gray-50 p-4">
  <main
    class="bg-white rounded-xl shadow-lg p-10 max-w-md w-full flex flex-col items-center"
    aria-label="Login Card"
  >
    <h1 class="text-3xl font-bold text-gray-900 mb-8 text-center">
      Welcome Back
    </h1>

    <form class="w-full space-y-6" aria-label="Login form">
      <!-- Employee ID -->
      <section>
        <label for="employeeId" class="block text-gray-700 font-semibold mb-2">
          Employee ID
        </label>
        <input
          type="text"
          id="employeeId"
          placeholder="Enter your Employee ID"
          class="w-full rounded-md border border-gray-300 p-3 text-gray-800 placeholder-gray-400 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
          required
          aria-required="true"
          autocomplete="username"
          autofocus
        />
      </section>

      <!-- Password -->
      <section>
        <label for="password" class="block text-gray-700 font-semibold mb-2">
          Password
        </label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          class="w-full rounded-md border border-gray-300 p-3 text-gray-800 placeholder-gray-400 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
          required
          aria-required="true"
          autocomplete="current-password"
        />
      </section>

      <!-- Submit Button -->
      <form (submit)="submitLogin(); $event.preventDefault()">
        <div>
          <button
            type="submit"
            class="w-full bg-[#3583FF] hover:bg-[#2572ec] text-white font-semibold py-1.5 rounded-md shadow-md transition text-sm"
          >
            Login
          </button>
        </div>
      </form>
    </form>

    <footer
      class="mt-6 text-center text-gray-500 text-sm"
      aria-label="Login footer"
    >
      &copy; 2025 TimeTracker. All rights reserved.
    </footer>
  </main>
</div>
