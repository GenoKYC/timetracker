<!-- ===== HEADER ===== -->
<div class="flex-shrink-0 ml-1 mt-3 mb-6">
  <div class="text-base font-semibold text-[#323944]">Employees</div>
  <div class="text-2xl font-bold mt-3 text-[#1F2937]">Employees Management</div>
  <div class="text-lg font-semibold text-[#323944]">
    Manage employee records and Information
  </div>
</div>

<!-- ===== STAT CARDS ===== -->
<div class="flex flex-row flex-wrap gap-4 p-1 pb-6">
  <ng-container *ngFor="let stat of stats">
    <div
      class="bg-[#FFFFFF] text-lg text-[#1F2937] font-bold rounded-lg p-4 border border-[#E5E7EB] flex flex-col items-start w-[210px] min-w-[150px] shadow-md"
    >
      <span class="text-[#1F2937] text-lg mb-2 font-semibold">{{
        stat.label
      }}</span>
      <span class="text-3xl font-bold" [ngStyle]="{ color: stat.color }">
        {{ stat.value }}
      </span>
    </div>
  </ng-container>
</div>

<!-- ===== ACTION BUTTONS ===== -->
<div class="flex justify-end gap-3 mb-4 mt-10">
  <button
    class="flex items-center gap-2 bg-[#323944] text-white font-semibold px-5 py-2 rounded-lg text-sm hover:bg-[#252C38] transition"
  >
    Export
  </button>
  <button
    (click)="isModalOpen = true"
    class="flex items-center gap-2 bg-[#5B8DFF] text-white font-semibold px-5 py-2 rounded-lg text-sm hover:bg-[#3D71E7] transition"
  >
    Add Employee
  </button>
</div>

<!-- ===== MODAL (Employees) ===== -->
<div
  *ngIf="isModalOpen"
  class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4 overflow-auto"
>
  <div
    class="bg-white rounded-xl p-6 max-w-xl w-full shadow-lg mx-4 my-6 max-h-[90vh] overflow-y-auto"
  >
    <h2 class="text-2xl font-bold mb-6 border-b pb-2">Add New Employee</h2>

    <form (submit)="submitEmployee($event)" class="space-y-6">
      <!-- Employee Details Section -->
      <section>
        <h3 class="text-lg font-semibold mb-3">Employee Details</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="employeeName" class="block mb-1 font-medium"
              >Employee Name</label
            >
            <input
              id="employeeName"
              type="text"
              placeholder="e.g. John Doe"
              [(ngModel)]="newEmployee.employee"
              name="employeeName"
              required
              class="border border-gray-300 rounded p-2 w-full"
            />
          </div>
          <div>
            <label for="contact" class="block mb-1 font-medium">Contact</label>
            <input
              id="contact"
              type="text"
              placeholder="e.g. +63 912 345 6789"
              [(ngModel)]="newEmployee.contact"
              name="contact"
              class="border border-gray-300 rounded p-2 w-full"
            />
          </div>
          <div>
            <label for="position" class="block mb-1 font-medium"
              >Position</label
            >
            <select
              id="position"
              [(ngModel)]="newEmployee.position"
              name="position"
              class="border border-gray-300 rounded p-2 w-full"
            >
              <option value="" disabled selected>Select Position</option>
              <option>CONTRACTUAL</option>
              <option>PART-TIMER</option>
              <option>PROJECT BASED</option>
            </select>
          </div>
          <div>
            <label for="roles" class="block mb-1 font-medium">Roles</label>
            <select
              id="roles"
              [(ngModel)]="newEmployee.roles"
              name="roles"
              class="border border-gray-300 rounded p-2 w-full"
            >
              <option value="" disabled selected>Select Role</option>
              <option>Photo Editor</option>
              <option>Video Editor</option>
              <option>Photographer</option>
              <option>Make-up Artist</option>
              <option>Videographer</option>
              <option>Production Assistant</option>
            </select>
          </div>
          <div>
            <label for="hire" class="block mb-1 font-medium">Hire Date</label>
            <input
              id="hire"
              type="date"
              [(ngModel)]="newEmployee.hire"
              name="hire"
              class="border border-gray-300 rounded p-2 w-full"
            />
          </div>
        </div>
      </section>

      <!-- Form Buttons -->
      <div class="flex justify-end gap-4 mt-6">
        <button
          type="button"
          (click)="isModalOpen = false"
          class="bg-gray-300 px-5 py-2 rounded"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="bg-[#5B8DFF] text-white px-5 py-2 rounded hover:bg-[#3D71E7] transition"
        >
          Submit
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ===== FILTER BAR ===== -->
<div
  class="flex items-center justify-between p-2 mb-4 rounded-lg border border-[#E5E7EB] w-full max-w-5xl mx-auto bg-[#FFFFFF] shadow-md"
>
  <!-- Left: Selects -->
  <div class="flex gap-3">
    <select
      class="border border-[#C9C9C9] text-[#323944] rounded-md px-3 py-2 text-xs font-semibold w-40"
    >
      <option value="" disabled selected>Select Position</option>
      <option>Developer</option>
      <option>Designer</option>
      <option>Manager</option>
    </select>
  </div>

  <!-- Right: Search -->
  <div
    class="flex items-center border border-[#C9C9C9] rounded-md px-3 py-2 flex-1 max-w-md min-w-0 bg-[#F6F5F0]"
  >
    <svg
      class="w-4 h-4 text-gray-400 mr-2 flex-shrink-0"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        d="M21 21l-4.35-4.35M10.5 17a6.5 6.5 0 1 1 0-13 6.5 6.5 0 0 1 0 13z"
      />
    </svg>
    <input
      type="text"
      placeholder="Search employees..."
      class="bg-transparent outline-none text-sm flex-1 min-w-0"
    />
  </div>
</div>

<!-- ===== EMPLOYEES TABLE as CARD ===== -->
<div
  class="rounded-lg border border-[#E5E7EB] bg-[#FFFFFF] shadow-lg p-4 mt-3 max-w-5xl w-full mx-auto overflow-x-auto"
>
  <table class="border-collapse w-full min-w-[750px]">
    <thead>
      <tr>
        <ng-container *ngFor="let heading of tableHeaders">
          <th
            class="px-4 py-3 text-left text-[#1F2937] font-semibold text-base border-b border-[#E5E7EB]"
          >
            {{ heading }}
          </th>
        </ng-container>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let record of timeRecords"
        class="hover:bg-[#F6F5F0] transition"
      >
        <td class="border-t px-4 py-2 text-[#323944] font-medium text-sm">
          {{ record.id }}
        </td>
        <td class="border-t px-4 py-2 text-[#323944] font-medium text-sm">
          {{ record.employee }}
        </td>
        <td class="border-t px-4 py-2 text-[#323944] font-medium text-sm">
          {{ record.contact }}
        </td>
        <td class="border-t px-4 py-2 text-[#323944] font-medium text-sm">
          {{ record.position }}
        </td>
        <td class="border-t px-4 py-2 text-[#323944] font-medium text-sm">
          {{ record.roles }}
        </td>
        <td class="border-t px-4 py-2 text-[#323944] font-medium text-sm">
          {{ record.hire }}
        </td>
      </tr>
    </tbody>
  </table>
</div>
