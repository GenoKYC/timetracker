<!-- ===== HEADER (unchanged) ===== -->
<div class="flex-shrink-0 ml-1 mt-3">
  <div class="text-base font-semibold text-[#4F4F4F]">Employees</div>
  <div class="text-2xl font-bold mt-3">Employees Management</div>
  <div class="text-lg font-semibold text-[#4F4F4F]">
    Manage employee records and Information
  </div>
</div>

<!-- ===== STATS CARDS (exact layout preserved) ===== -->
<div class="flex flex-row flex-wrap gap-4 p-1 pb-3 mt-6">
  <ng-container *ngFor="let stat of stats">
    <div
      class="bg-white text-lg text-[#4F4F4F] font-bold rounded-lg p-4 border border-[#c9c9c9] flex flex-col items-start w-[210px] min-w-[150px]"
    >
      <span class="text-[#363636] text-lg mb-2 font-semibold">
        {{ stat.label }}
      </span>
      <span class="text-3xl font-bold" [ngStyle]="{ color: stat.color }">
        {{ stat.value }}
      </span>
    </div>
  </ng-container>
</div>

<!-- ===== ACTION BUTTONS (aligned right, consistent size) ===== -->
<div class="flex justify-end gap-3 mb-3 mt-10">
  <button
    class="flex items-center gap-2 bg-[#4F4F4F] text-white font-semibold px-5 py-2 rounded-lg text-sm hover:bg-[#3a3a3a] transition"
  >
    Export
  </button>
  <button
    (click)="isModalOpen = true"
    class="flex items-center gap-2 bg-[#3583FF] text-white font-semibold px-5 py-2 rounded-lg text-sm hover:bg-[#2572ec] transition"
  >
    Add Employee
  </button>
</div>
<!-- Modal Popup -->
<!-- Modal Backdrop and Container -->
<div
  *ngIf="isModalOpen"
  class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4 overflow-auto"
>
  <div
    class="bg-white rounded-xl p-6 max-w-xl w-full shadow-lg mx-4 my-6 max-h-[90vh] overflow-y-auto"
  >
    <h2 class="text-2xl font-bold mb-6 border-b pb-2">Add New Employee</h2>

    <form
      (submit)="submitEmployee($event)"
      class="grid grid-cols-1 md:grid-cols-2 gap-6"
    >
      <!-- Employee Name -->
      <div>
        <label for="employeeName" class="block mb-1 font-medium"
          >Employee Name</label
        >
        <input
          id="employeeName"
          type="text"
          placeholder="e.g. John Doe"
          [(ngModel)]="newEmployee.employee"
          name="employeeName"
          class="border border-gray-300 rounded p-2 w-full"
          required
        />
      </div>

      <!-- Contact -->
      <div>
        <label for="contact" class="block mb-1 font-medium">Contact</label>
        <input
          id="contact"
          type="text"
          placeholder="e.g. +63 912 345 6789"
          [(ngModel)]="newEmployee.contact"
          name="contact"
          class="border border-gray-300 rounded p-2 w-full"
        />
      </div>

      <!-- Position -->
      <div>
        <label for="position" class="block mb-1 font-medium">Position</label>
        <select
          id="position"
          [(ngModel)]="newEmployee.position"
          name="position"
          class="border border-gray-300 rounded p-2 w-full"
        >
          <option value="" disabled selected>Select Position</option>
          <option value="CONTRACTUAL">CONTRACTUAL</option>
          <option value="PART-TIMER">PART-TIMER</option>
          <option value="PROJECT BASED">PROJECT BASED</option>
        </select>
      </div>

      <!-- Roles -->
      <div>
        <label for="roles" class="block mb-1 font-medium">Roles</label>
        <select
          id="roles"
          [(ngModel)]="newEmployee.roles"
          name="roles"
          class="border border-gray-300 rounded p-2 w-full"
        >
          <option value="" disabled selected>Select Role</option>
          <option value="Photo Editor">Photo Editor</option>
          <option value="Video Editor">Video Editor</option>
          <option value="Photographer">Photographer</option>
          <option value="Make-up Artist">Make-up Artist</option>
          <option value="Videographer">Videographer</option>
          <option value="Production Assistant">Production Assistant</option>
        </select>
      </div>

      <!-- Hire Date -->
      <div>
        <label for="hire" class="block mb-1 font-medium">Hire Date</label>
        <input
          id="hire"
          type="date"
          [(ngModel)]="newEmployee.hire"
          name="hire"
          class="border border-gray-300 rounded p-2 w-full"
        />
      </div>

      <!-- Button group -->
      <div class="md:col-span-2 flex justify-center gap-4 mt-4">
        <button
          type="button"
          (click)="isModalOpen = false"
          class="bg-gray-300 text-gray-700 px-5 py-2 rounded"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="bg-[#3583FF] text-white px-5 py-2 rounded-lg hover:bg-[#2572ec] transition"
        >
          Submit
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ===== FILTER BAR (exact position & size) ===== -->
<div
  class="flex items-center justify-between p-2 mb-2 rounded-lg border border-[#c9c9c9] w-full max-w-[920px] mx-auto"
>
  <!-- Left: Selects -->
  <div class="flex gap-3">
    <select
      class="border border-[#8E8E8E] text-[#2D2D2D] rounded-md px-3 py-2 text-xs font-semibold w-40"
    >
      <option value="" disabled selected>Select Position</option>
      <option>Developer</option>
      <option>Designer</option>
      <option>Manager</option>
    </select>
  </div>

  <!-- Right: Search (fixed invalid class) -->
  <div
    class="flex items-center border border-[#8E8E8E] rounded-md px-3 py-2 flex-1 max-w-md min-w-0"
  >
    <svg
      class="w-4 h-4 text-gray-400 mr-2 flex-shrink-0"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        d="M21 21l-4.35-4.35M10.5 17a6.5 6.5 0 1 1 0-13 6.5 6.5 0 0 1 0 13z"
      />
    </svg>
    <input
      type="text"
      placeholder="Search employees..."
      class="bg-transparent outline-none text-sm flex-1 min-w-0"
    />
  </div>
</div>

<!-- ===== TABLE (exact 920px wrapper) ===== -->
<div class="rounded-lg border border-[#c9c9c9] overflow-x-auto w-[920px]">
  <table class="min-w-full border-collapse">
    <thead class="">
      <tr>
        <ng-container *ngFor="let heading of tableHeaders">
          <th
            class="px-4 py-3 text-left text-[#1E1E1E] font-semibold text-base"
          >
            {{ heading }}
          </th>
        </ng-container>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let record of timeRecords"
        class="hover:bg-gray-50 transition"
      >
        <td class="border-t px-4 py-2 text-[#2B2B2B] font-medium text-sm">
          {{ record.id }}
        </td>
        <td class="border-t px-4 py-2 text-[#2B2B2B] font-medium text-sm">
          {{ record.employee }}
        </td>
        <td class="border-t px-4 py-2 text-[#374151] font-medium text-sm">
          {{ record.contact }}
        </td>
        <td class="border-t px-4 py-2 text-[#374151] font-medium text-sm">
          {{ record.position }}
        </td>
        <td class="border-t px-4 py-2 text-[#374151] font-medium text-sm">
          {{ record.roles }}
        </td>

        <td class="border-t px-4 py-2 text-[#374151] font-medium text-sm">
          {{ record.hire }}
        </td>
      </tr>
    </tbody>
  </table>
</div>
