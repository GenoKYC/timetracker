<!-- ===== HEADER (unchanged) ===== -->
<div class="flex-shrink-0 ml-1 mt-3">
  <div class="text-base font-semibold text-[#4F4F4F]">Positions & Roles</div>
  <div class="text-2xl font-bold mt-3">Positions</div>
  <div class="text-lg font-semibold text-[#4F4F4F]">
    Manage the type of employment (Contractual, Part-Timer, Project-Based)
  </div>
</div>

<!-- ===== ACTION BUTTONS (aligned right, consistent size) ===== -->
<div class="flex justify-end gap-3 mb-3 mt-10">
  <button
    class="flex items-center gap-2 bg-[#4F4F4F] text-white font-semibold px-5 py-2 rounded-lg text-sm hover:bg-[#3a3a3a] transition"
  >
    Export
  </button>
  <button
    (click)="isPositionModalOpen = true"
    class="flex items-center gap-2 bg-[#3583FF] text-white font-semibold px-5 py-2 rounded-lg text-sm hover:bg-[#2572ec] transition"
  >
    Add Position
  </button>
</div>
<div
  *ngIf="isPositionModalOpen"
  class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4"
>
  <div class="bg-white rounded-xl p-6 max-w-md w-full shadow-lg">
    <h2 class="text-xl font-bold mb-4 border-b pb-2">Add New Position</h2>

    <form (submit)="submitPosition($event)" class="space-y-6">
      <!-- Basic Position Info Section -->
      <section>
        <h3 class="text-lg font-semibold mb-3">Position Information</h3>
        <div class="space-y-4">
          <div>
            <label for="position" class="block mb-1 font-semibold text-sm"
              >Position</label
            >
            <input
              id="position"
              type="text"
              class="border border-gray-300 rounded p-2 w-full text-sm"
              placeholder="e.g. Contractual"
              [(ngModel)]="newPosition.position"
              name="position"
              required
            />
          </div>
          <div>
            <label for="description" class="block mb-1 font-semibold text-sm"
              >Description</label
            >
            <input
              id="description"
              type="text"
              class="border border-gray-300 rounded p-2 w-full text-sm"
              placeholder="e.g. Short-term project work"
              [(ngModel)]="newPosition.description"
              name="description"
              required
            />
          </div>
        </div>
      </section>

      <!-- Assignment Section -->
      <section>
        <h3 class="text-lg font-semibold mb-3">Assignment Details</h3>
        <div class="space-y-4">
          <div>
            <label for="employees" class="block mb-1 font-semibold text-sm"
              >Employees</label
            >
            <input
              id="employees"
              type="number"
              min="0"
              class="border border-gray-300 rounded p-2 w-full text-sm"
              placeholder="Number of employees"
              [(ngModel)]="newPosition.employees"
              name="employees"
              required
            />
          </div>
        </div>
      </section>

      <div class="flex justify-end gap-3 pt-4 border-t">
        <button
          type="button"
          (click)="isPositionModalOpen = false"
          class="bg-gray-300 text-gray-700 px-4 py-2 rounded"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="bg-[#3583FF] text-white px-4 py-2 rounded hover:bg-[#2572ec] transition"
        >
          Submit
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ===== TABLE (exact 920px wrapper) ===== -->
<div class="rounded-lg border border-[#c9c9c9] overflow-x-auto w-[920px]">
  <table class="min-w-full border-collapse">
    <thead class="">
      <tr>
        <ng-container *ngFor="let heading of tableHeaders">
          <th
            class="px-4 py-3 text-left text-[#1E1E1E] font-semibold text-base"
          >
            {{ heading }}
          </th>
        </ng-container>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let record of positions" class="hover:bg-gray-50 transition">
        <td class="border-t px-4 py-3 text-[#2B2B2B] font-medium text-sm">
          {{ record.position }}
        </td>
        <td class="border-t px-4 py-3 text-[#374151] font-medium text-sm">
          {{ record.description }}
        </td>
        <td class="border-t px-4 py-3 text-[#374151] font-medium text-sm">
          {{ record.employees }}
        </td>
      </tr>
    </tbody>
  </table>
</div>
