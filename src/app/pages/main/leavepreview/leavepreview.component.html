<!-- ===== HEADER ===== -->
<div class="flex-shrink-0 mt-3 mb-6">
  <div class="text-base font-semibold text-[#323944]">Leave</div>
  <div class="text-2xl font-bold mt-3 text-[#1F2937]">
    Leave Request Management
  </div>
  <div class="text-lg font-semibold text-[#323944]">
    Define and manage different types of leave
  </div>
</div>

<!-- ===== ACTION BUTTONS ===== -->
<div class="flex w-full justify-end gap-3 mb-4 mt-10">
  <button
    class="flex items-center gap-2 bg-[#323944] text-white font-semibold px-5 py-2 rounded-lg text-sm hover:bg-[#252C38] transition"
  >
    Export
  </button>
  <button
    (click)="isModalOpen = true"
    class="flex items-center gap-2 bg-[#5B8DFF] text-white font-semibold px-5 py-2 rounded-lg text-sm hover:bg-[#3D71E7] transition"
  >
    Add Employee
  </button>
</div>

<!-- ===== MODAL POPUP FOR ADD LEAVE REQUEST ===== -->
<div
  *ngIf="isModalOpen"
  class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4"
>
  <div
    class="p-6 max-w-xl w-full bg-white rounded-lg shadow-lg max-h-[90vh] overflow-y-auto mx-4 my-6"
  >
    <h2 class="text-xl font-bold mb-6 border-b pb-2">Add Leave Request</h2>
    <form
      (submit)="submitLeaveRequest($event)"
      class="grid grid-cols-1 md:grid-cols-2 gap-5"
    >
      <!-- Employee -->
      <div>
        <label for="employee" class="block mb-1 font-semibold text-sm"
          >Employee</label
        >
        <input
          id="employee"
          type="text"
          placeholder="e.g. Jane Doe"
          [(ngModel)]="newLeaveRequest.employee"
          name="employee"
          required
          class="border border-gray-300 rounded p-2 w-full text-sm"
        />
      </div>

      <!-- Position -->
      <div>
        <label for="position" class="block mb-1 font-semibold text-sm"
          >Position</label
        >
        <input
          id="position"
          type="text"
          placeholder="e.g. Software Engineer"
          [(ngModel)]="newLeaveRequest.position"
          name="position"
          required
          class="border border-gray-300 rounded p-2 w-full text-sm"
        />
      </div>

      <!-- Contact -->
      <div>
        <label for="contact" class="block mb-1 font-semibold text-sm"
          >Contact</label
        >
        <input
          id="contact"
          type="text"
          placeholder="e.g. 09123456789"
          [(ngModel)]="newLeaveRequest.contact"
          name="contact"
          class="border border-gray-300 rounded p-2 w-full text-sm"
        />
      </div>

      <!-- Leave Type -->
      <div>
        <label for="leavetype" class="block mb-1 font-semibold text-sm"
          >Leave Type</label
        >
        <input
          id="leavetype"
          type="text"
          placeholder="e.g. Sick Leave"
          [(ngModel)]="newLeaveRequest.leavetype"
          name="leavetype"
          required
          class="border border-gray-300 rounded p-2 w-full text-sm"
        />
      </div>

      <!-- Date -->
      <div>
        <label for="date" class="block mb-1 font-semibold text-sm">Date</label>
        <input
          id="date"
          type="date"
          [(ngModel)]="newLeaveRequest.date"
          name="date"
          class="border border-gray-300 rounded p-2 w-full text-sm"
        />
      </div>

      <!-- Status -->
      <div>
        <label for="status" class="block mb-1 font-semibold text-sm"
          >Status</label
        >
        <select
          id="status"
          [(ngModel)]="newLeaveRequest.status"
          name="status"
          required
          class="border border-gray-300 rounded p-2 w-full text-sm"
        >
          <option value="" disabled selected>Select status</option>
          <option>Approved</option>
          <option>Pending</option>
          <option>Rejected</option>
        </select>
      </div>

      <!-- Date From-To -->
      <div>
        <label for="dateRange" class="block mb-1 font-semibold text-sm"
          >Date (From-To)</label
        >
        <input
          id="dateRange"
          type="text"
          placeholder="e.g. 12 Jan 2024 - 15 Jan 2024"
          [(ngModel)]="newLeaveRequest.date"
          name="dateRange"
          required
          class="border border-gray-300 rounded p-2 w-full text-sm"
        />
      </div>

      <!-- Buttons -->
      <div class="md:col-span-2 flex justify-end gap-3 pt-6 border-t">
        <button
          type="button"
          (click)="isModalOpen = false"
          class="bg-gray-300 text-gray-700 px-4 py-2 rounded"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="bg-[#5B8DFF] text-white px-4 py-2 rounded hover:bg-[#3D71E7] transition"
        >
          Submit
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ===== FILTER BAR ===== -->
<div
  class="flex items-center justify-between p-2 mb-3 rounded-lg border border-[#E5E7EB] w-full bg-[#FFFFFF] shadow-md max-w-[920px] mx-auto"
>
  <!-- Left: Position & Status -->
  <div class="flex gap-3">
    <select
      class="border border-[#8E8E8E] text-[#2D2D2D] rounded-md px-3 py-2 text-xs font-semibold w-40"
    >
      <option>All Position</option>
      <option>Developer</option>
      <option>Designer</option>
      <option>Manager</option>
    </select>
    <select
      class="border border-[#8E8E8E] text-[#2D2D2D] rounded-md px-3 py-2 text-xs font-semibold w-40"
    >
      <option>All Status</option>
      <option>Active</option>
      <option>Inactive</option>
    </select>
  </div>

  <!-- Right: Search -->
  <div
    class="flex items-center border border-[#8E8E8E] rounded-md px-3 py-2 flex-1 max-w-md min-w-0 bg-[#F6F5F0]"
  >
    <svg
      class="w-4 h-4 text-gray-400 mr-2 flex-shrink-0"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        d="M21 21l-4.35-4.35M10.5 17a6.5 6.5 0 1 1 0-13 6.5 6.5 0 0 1 0 13z"
      />
    </svg>
    <input
      type="text"
      placeholder="Search employees..."
      class="bg-transparent outline-none text-sm flex-1 min-w-0"
    />
  </div>
</div>

<!-- ===== TABLE CARD ===== -->
<div
  class="rounded-lg border border-[#E5E7EB] bg-[#FFFFFF] shadow-lg p-4 w-full min-w-[750px] max-h-[375px] overflow-auto"
>
  <table class="border-collapse w-full min-w-[750px]">
    <thead>
      <tr>
        <ng-container *ngFor="let heading of tableHeaders">
          <th
            class="px-4 py-3 text-left text-[#1F2937] font-semibold text-base border-b border-[#E5E7EB]"
          >
            {{ heading }}
          </th>
        </ng-container>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let record of timeRecords"
        class="hover:bg-[#F6F5F0] transition"
      >
        <td class="border-t px-4 py-2 text-[#323944] font-medium text-sm">
          {{ record.employee }}
        </td>
        <td class="border-t px-4 py-2 text-[#323944] font-medium text-sm">
          {{ record.position }}
        </td>
        <td class="border-t px-4 py-2 text-[#323944] font-medium text-sm">
          {{ record.contact }}
        </td>
        <td class="border-t px-4 py-2 text-[#323944] font-medium text-sm">
          {{ record.leavetype }}
        </td>
        <td
          class="border-t px-4 py-3 font-medium text-sm"
          [ngStyle]="{ color: record.statusColor }"
        >
          {{ record.status }}
        </td>
      </tr>
    </tbody>
  </table>
</div>
