<!-- ===== HEADER (unchanged) ===== -->
<div class="flex-shrink-0 ml-1 mt-3">
  <div class="text-base font-semibold text-[#4F4F4F]">Leave</div>
  <div class="text-2xl font-bold mt-3">Leave Request Management</div>
  <div class="text-lg font-semibold text-[#4F4F4F]">
    Define and manage different types of leave
  </div>
</div>

<!-- ===== ACTION BUTTONS (aligned right, consistent size) ===== -->
<div class="flex justify-end gap-3 mb-3 mt-10">
  <button
    class="flex items-center gap-2 bg-[#4F4F4F] text-white font-semibold px-5 py-2 rounded-lg text-sm hover:bg-[#3a3a3a] transition"
  >
    Export
  </button>
  <button
    (click)="isModalOpen = true"
    class="flex items-center gap-2 bg-[#3583FF] text-white font-semibold px-5 py-2 rounded-lg text-sm hover:bg-[#2572ec] transition"
  >
    Add Employee
  </button>
</div>

<!-- Modal Popup -->
<div
  *ngIf="isModalOpen"
  class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4"
>
  <div class="bg-white rounded-lg p-6 max-w-xl w-full">
    <h2 class="text-xl font-bold mb-4">Add Leave Request</h2>
    <form
      (submit)="submitLeaveRequest($event)"
      class="grid grid-cols-1 md:grid-cols-2 gap-5"
    >
      <!-- Employee -->
      <div>
        <label for="employee" class="block mb-1 font-semibold text-sm"
          >Employee</label
        >
        <input
          id="employee"
          type="text"
          class="border border-gray-300 rounded p-2 w-full text-sm"
          placeholder="e.g. Jane Doe"
          [(ngModel)]="newLeaveRequest.employee"
          name="employee"
          required
        />
      </div>

      <!-- Position -->
      <div>
        <label for="position" class="block mb-1 font-semibold text-sm"
          >Position</label
        >
        <input
          id="position"
          type="text"
          class="border border-gray-300 rounded p-2 w-full text-sm"
          placeholder="e.g. Software Engineer"
          [(ngModel)]="newLeaveRequest.position"
          name="position"
          required
        />
      </div>

      <!-- Contact -->
      <div>
        <label for="contact" class="block mb-1 font-semibold text-sm"
          >Contact</label
        >
        <input
          id="contact"
          type="text"
          class="border border-gray-300 rounded p-2 w-full text-sm"
          placeholder="e.g. 09123456789"
          [(ngModel)]="newLeaveRequest.contact"
          name="contact"
        />
      </div>

      <!-- Leave Type -->
      <div>
        <label for="leavetype" class="block mb-1 font-semibold text-sm"
          >Leave Type</label
        >
        <input
          id="leavetype"
          type="text"
          class="border border-gray-300 rounded p-2 w-full text-sm"
          placeholder="e.g. Sick Leave"
          [(ngModel)]="newLeaveRequest.leavetype"
          name="leavetype"
          required
        />
      </div>

      <!-- Date -->
      <div>
        <label for="date" class="block mb-1 font-semibold text-sm">Date</label>
        <input
          id="date"
          type="date"
          class="border border-gray-300 rounded p-2 w-full text-sm"
          [(ngModel)]="newLeaveRequest.date"
          name="date"
        />
      </div>

      <!-- Status -->
      <div>
        <label for="status" class="block mb-1 font-semibold text-sm"
          >Status</label
        >
        <select
          id="status"
          class="border border-gray-300 rounded p-2 w-full text-sm"
          [(ngModel)]="newLeaveRequest.status"
          name="status"
          required
        >
          <option value="" disabled selected>Select Status</option>
          <option>Pending</option>
          <option>Approved</option>
          <option>Rejected</option>
        </select>
      </div>

      <!-- Action Buttons -->
      <div class="md:col-span-2 flex justify-end gap-3 w-full mt-1">
        <button
          type="button"
          (click)="isModalOpen = false"
          class="bg-gray-300 text-gray-700 px-4 py-2 rounded"
        >
          Cancel
        </button>
        <button
          (click)="isModalOpen = true"
          type="submit"
          class="bg-[#3583FF] text-white px-4 py-2 rounded-lg hover:bg-[#2572ec] transition"
        >
          Submit
        </button>
      </div>
    </form>
  </div>
</div>

<div
  *ngIf="isModalOpen"
  class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4"
>
  <div
    class="bg-white rounded-xl p-6 max-w-lg w-full shadow-lg mx-4 my-6 max-h-[90vh] overflow-y-auto"
  >
    <h2 class="text-2xl font-bold mb-6 border-b pb-2">Add Leave Request</h2>
    <form (submit)="submitLeaveRequest($event)" class="space-y-6">
      <!-- Personal Info -->
      <section>
        <h3 class="text-lg font-semibold mb-3">Employee Details</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="employee" class="block mb-1 font-semibold text-sm"
              >Employee</label
            >
            <input
              id="employee"
              type="text"
              placeholder="Employee name"
              class="border border-gray-300 rounded p-2 w-full text-sm"
              [(ngModel)]="newLeaveRequest.employee"
              name="employee"
              required
            />
          </div>
          <div>
            <label for="contact" class="block mb-1 font-semibold text-sm"
              >Contact</label
            >
            <input
              id="contact"
              type="text"
              placeholder="Contact number"
              class="border border-gray-300 rounded p-2 w-full text-sm"
              [(ngModel)]="newLeaveRequest.contact"
              name="contact"
              required
            />
          </div>
        </div>
      </section>

      <!-- Leave Details -->
      <section>
        <h3 class="text-lg font-semibold mb-3">Leave Information</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="position" class="block mb-1 font-semibold text-sm"
              >Position</label
            >
            <input
              id="position"
              type="text"
              placeholder="Position"
              class="border border-gray-300 rounded p-2 w-full text-sm"
              [(ngModel)]="newLeaveRequest.position"
              name="position"
              required
            />
          </div>
          <div>
            <label for="leavetype" class="block mb-1 font-semibold text-sm"
              >Leave Type</label
            >
            <input
              id="leavetype"
              type="text"
              placeholder="Leave type (e.g. Annual)"
              class="border border-gray-300 rounded p-2 w-full text-sm"
              [(ngModel)]="newLeaveRequest.leavetype"
              name="leavetype"
              required
            />
          </div>
          <div>
            <label for="status" class="block mb-1 font-semibold text-sm"
              >Status</label
            >
            <select
              id="status"
              class="border border-gray-300 rounded p-2 w-full text-sm"
              [(ngModel)]="newLeaveRequest.status"
              name="status"
              required
            >
              <option value="" disabled selected>Select status</option>
              <option>Approved</option>
              <option>Pending</option>
              <option>Rejected</option>
            </select>
          </div>
          <div>
            <label for="date" class="block mb-1 font-semibold text-sm"
              >Date (From-To)</label
            >
            <input
              id="date"
              type="text"
              placeholder="e.g. 12 Jan 2024 - 15 Jan 2024"
              class="border border-gray-300 rounded p-2 w-full text-sm"
              [(ngModel)]="newLeaveRequest.date"
              name="date"
              required
            />
          </div>
        </div>
      </section>

      <!-- Buttons -->
      <div class="flex justify-end gap-3 pt-6 border-t">
        <button
          type="button"
          class="bg-gray-300 text-gray-700 px-4 py-2 rounded"
          (click)="isModalOpen = false"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="bg-[#3583FF] text-white px-4 py-2 rounded hover:bg-[#2572ec] transition"
        >
          Submit
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ===== FILTER BAR (exact position & size) ===== -->
<div
  class="flex items-center justify-between p-2 mb-2 rounded-lg border border-[#c9c9c9] w-full max-w-[920px] mx-auto"
>
  <!-- Left: Selects -->
  <div class="flex gap-3">
    <select
      class="border border-[#8E8E8E] text-[#2D2D2D] rounded-md px-3 py-2 text-xs font-semibold w-40"
    >
      <option>All Position</option>
      <option>Developer</option>
      <option>Designer</option>
      <option>Manager</option>
    </select>
    <select
      class="border border-[#8E8E8E] text-[#2D2D2D] rounded-md px-3 py-2 text-xs font-semibold w-40"
    >
      <option>All Status</option>
      <option>Active</option>
      <option>Inactive</option>
    </select>
  </div>

  <!-- Right: Search (fixed invalid class) -->
  <div
    class="flex items-center border border-[#8E8E8E] rounded-md px-3 py-2 flex-1 max-w-md min-w-0"
  >
    <svg
      class="w-4 h-4 text-gray-400 mr-2 flex-shrink-0"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        d="M21 21l-4.35-4.35M10.5 17a6.5 6.5 0 1 1 0-13 6.5 6.5 0 0 1 0 13z"
      />
    </svg>
    <input
      type="text"
      placeholder="Search employees..."
      class="bg-transparent outline-none text-sm flex-1 min-w-0"
    />
  </div>
</div>

<!-- ===== TABLE (exact 920px wrapper) ===== -->
<div class="rounded-lg border border-[#c9c9c9] overflow-x-auto w-[920px]">
  <table class="min-w-full border-collapse">
    <thead class="">
      <tr>
        <ng-container *ngFor="let heading of tableHeaders">
          <th
            class="px-4 py-3 text-left text-[#1E1E1E] font-semibold text-base"
          >
            {{ heading }}
          </th>
        </ng-container>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let record of timeRecords"
        class="hover:bg-gray-50 transition"
      >
        <td class="border-t px-4 py-2 text-[#2B2B2B] font-medium text-sm">
          {{ record.employee }}
        </td>
        <td class="border-t px-4 py-2 text-[#374151] font-medium text-sm">
          {{ record.position }}
        </td>
        <td class="border-t px-4 py-2 text-[#374151] font-medium text-sm">
          {{ record.contact }}
        </td>
        <td class="border-t px-4 py-2 text-[#374151] font-medium text-sm">
          {{ record.leavetype }}
        </td>
        <td class="border-t px-4 py-2 text-[#374151] font-medium text-sm">
          {{ record.date }}
        </td>
        <td
          class="border-t px-4 py-3 font-medium text-sm"
          [ngStyle]="{ color: record.statusColor }"
        >
          {{ record.status }}
        </td>
      </tr>
    </tbody>
  </table>
</div>
