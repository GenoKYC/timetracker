<!-- ===== HEADER ===== -->

<div class="flex-shrink-0 ml-1 mt-3 mb-6">
  <div class="text-base font-semibold text-[#323944]">Positions</div>
  <div class="text-2xl font-bold mt-3 text-[#1F2937]">Positions</div>
  <div class="text-lg font-semibold text-[#323944]">
    Manage the type of employment (Contractual, Part-Timer, Project-Based)
  </div>
</div>

<!-- ===== ACTION BUTTONS ===== -->
<div class="flex justify-end gap-3 mb-4 mt-10">
  <button
    class="flex items-center gap-2 bg-[#323944] text-white font-semibold px-5 py-2 rounded-lg text-sm hover:bg-[#252C38] transition"
  >
    Export
  </button>
  <button
    (click)="isPositionModalOpen = true"
    class="flex items-center gap-2 bg-[#5B8DFF] text-white font-semibold px-5 py-2 rounded-lg text-sm hover:bg-[#3D71E7] transition"
  >
    Add Position
  </button>
</div>

<!-- ===== MODAL (styled to match dashboard) ===== -->
<div
  *ngIf="isPositionModalOpen"
  class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4"
>
  <div class="bg-white rounded-xl p-6 max-w-md w-full shadow-lg">
    <h2 class="text-xl font-bold mb-4 border-b pb-2">Add New Position</h2>
    <form (submit)="submitPosition($event)" class="space-y-6">
      <section>
        <h3 class="text-lg font-semibold mb-3">Position Information</h3>
        <div class="space-y-4">
          <div>
            <label for="position" class="block mb-1 font-semibold text-sm"
              >Position</label
            >
            <input
              id="position"
              type="text"
              class="border border-gray-300 rounded p-2 w-full text-sm"
              placeholder="e.g. Contractual"
              [(ngModel)]="newPosition.position"
              name="position"
              required
            />
          </div>
        </div>
      </section>
      <div class="flex justify-end gap-3 pt-4 border-t">
        <button
          type="button"
          (click)="isPositionModalOpen = false"
          class="bg-gray-300 text-gray-700 px-4 py-2 rounded"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="bg-[#5B8DFF] text-white px-4 py-2 rounded hover:bg-[#3D71E7] transition"
        >
          Submit
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ===== TABLE CARD (LEFT ALIGNED, MATCHES CARDS) ===== -->
<div
  class="rounded-lg border border-[#E5E7EB] bg-[#FFFFFF] shadow-lg p-4 mt-3 w-full overflow-y-auto max-h-[350px]"
>
  <table class="border-collapse w-full min-w-[450px]">
    <thead>
      <tr>
        <ng-container *ngFor="let heading of tableHeaders">
          <th
            class="px-4 py-3 text-left text-[#1F2937] font-semibold text-base border-b border-[#E5E7EB]"
          >
            {{ heading }}
          </th>
        </ng-container>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let record of positions"
        class="hover:bg-[#F6F5F0] transition"
      >
        <td class="border-t px-4 py-3 text-[#323944] font-medium text-sm">
          {{ record.positionid }}
        </td>
        <td class="border-t px-4 py-3 text-[#323944] font-medium text-sm">
          {{ record.position }}
        </td>
      </tr>
    </tbody>
  </table>
</div>
