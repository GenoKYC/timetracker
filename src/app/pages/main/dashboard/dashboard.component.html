<div class="flex-shrink-0 ml-1 mt-3">
  <div class="text-base font-semibold text-[#4F4F4F]">Overview</div>
  <div class="text-2xl font-bold mt-3">Welcome back!, {{ companyName }}</div>
  <div class="text-lg font-semibold text-[#4F4F4F]">
    It’s {{ day }}, {{ date }}
  </div>
</div>

<!-- One-row card layout -->
<div class="flex flex-row flex-wrap gap-4 p-1 pb-3 mt-6">
  <ng-container *ngFor="let stat of stats">
    <div
      class="bg-white text-lg text-[#4F4F4F] font-bold rounded-lg p-4 border border-[#E0E0E0] flex flex-col items-start w-[210px] min-w-[150px]"
    >
      <span class="text-[#363636] text-lg mb-2 font-semibold">
        {{ stat.label }}
      </span>
      <span class="text-3xl font-bold" [ngStyle]="{ color: stat.color }">
        {{ stat.value }}
      </span>
    </div>
  </ng-container>
</div>

<h2 class="text-[#444444] font-medium text-lg mb-3 mt-4">
  Latest Time In/Time Out
</h2>
<div class="rounded-lg border border-[#E0E0E0] overflow-x-auto">
  <table class="min-w-full border-collapse">
    <thead>
      <tr>
        <ng-container *ngFor="let heading of tableHeaders">
          <th
            class="px-4 py-3 text-left text-[#1E1E1E] font-semibold text-base"
          >
            {{ heading }}
          </th>
        </ng-container>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let record of timeRecords">
        <td class="border-t px-4 py-2 text-[#2B2B2B] font-medium text-sm">
          {{ record.employee }}
        </td>
        <td class="border-t px-4 py-2 text-[#374151] font-medium text-sm">
          {{ record.position }}
        </td>
        <td class="border-t px-4 py-2 text-[#374151] font-medium text-sm">
          {{ record.department }}
        </td>
        <td
          class="border-t px-4 py-3 font-medium text-sm"
          [ngStyle]="{ color: record.statusColor }"
        >
          {{ record.status }}
        </td>
        <td
          class="border-t px-4 py-3 font-medium text-sm"
          [ngStyle]="{ color: record.timeInColor }"
        >
          {{ record.timeIn }}
        </td>
        <td
          class="border-t px-4 py-3 font-medium text-sm"
          [ngStyle]="{ color: record.timeOutColor }"
        >
          {{ record.timeOut }}
        </td>
      </tr>
    </tbody>
  </table>
</div>
