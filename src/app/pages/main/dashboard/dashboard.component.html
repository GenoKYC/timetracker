<!-- Overview Block -->
<div class="flex-shrink-0 ml-1 mt-3 tracking-tight mb-6">
  <div class="text-base font-semibold text-[#323944]">Overview</div>
  <div class="text-2xl font-bold mt-3 text-[#1F2937]">
    Welcome back!, {{ companyName }}
  </div>
  <div class="text-lg font-semibold text-[#323944]">
    It’s {{ day }}, {{ date }}
  </div>
</div>

<!-- Stat Cards -->
<div class="flex flex-row flex-wrap gap-4 p-1 pb-6">
  <ng-container *ngFor="let stat of stats">
    <div
      class="bg-[#FFFFFF] text-lg text-[#1F2937] font-bold rounded-lg p-4 border border-[#E5E7EB] flex flex-col items-start w-[210px] min-w-[150px] shadow-md"
    >
      <span class="text-[#1F2937] text-lg mb-2 font-semibold">
        {{ stat.label }}
      </span>
      <span class="text-3xl font-bold" [ngStyle]="{ color: stat.color }">
        {{ stat.value }}
      </span>
    </div>
  </ng-container>
</div>

<!-- Section Heading -->
<h2 class="text-[#1F2937] font-medium text-lg mb-4 mt-1">
  Latest Time In/Time Out
</h2>

<!-- Table as Card -->
<div
  class="rounded-lg border border-[#E5E7EB] bg-[#FFFFFF] shadow-lg p-4 mt-3 max-w-5xl w-full mx-auto overflow-x-auto"
>
  <table class="border-collapse w-full min-w-[640px]">
    <thead>
      <tr>
        <ng-container *ngFor="let heading of tableHeaders">
          <th
            class="px-4 py-2 text-left text-[#1F2937] font-semibold text-base border-b border-[#E5E7EB]"
          >
            {{ heading }}
          </th>
        </ng-container>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let record of timeRecords"
        class="hover:bg-[#F6F5F0] transition-colors"
      >
        <td class="border-t px-4 py-2 text-[#323944] font-medium text-sm">
          {{ record.employee }}
        </td>
        <td class="border-t px-4 py-2 text-[#323944] font-medium text-sm">
          {{ record.position }}
        </td>
        <td class="border-t px-4 py-2 text-[#323944] font-medium text-sm">
          {{ record.department }}
        </td>
        <td
          class="border-t px-4 py-3 font-medium text-sm"
          [ngStyle]="{ color: record.statusColor }"
        >
          {{ record.status }}
        </td>
        <td
          class="border-t px-4 py-3 font-medium text-sm"
          [ngStyle]="{ color: record.timeInColor }"
        >
          {{ record.timeIn }}
        </td>
        <td
          class="border-t px-4 py-3 font-medium text-sm"
          [ngStyle]="{ color: record.timeOutColor }"
        >
          {{ record.timeOut }}
        </td>
      </tr>
    </tbody>
  </table>
</div>
